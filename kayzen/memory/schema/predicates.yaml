predicates:
  - id: role
    description: Current or historical role held by a person.
  - id: base
    description: Primary place where an entity is based.
  - id: employer
    description: Organization employing a person.
  - id: primary-project
    description: Project currently treated as primary.
  - id: tool
    description: Tool or platform used by an entity.
  - id: collaborator
    description: Person collaborating with an entity or project.
  - id: publication-channel
    description: Where a project is published.
  - id: language
    description: Preferred working language.
  - id: definition
    description: Short definition of a concept.
  - id: component-of
    description: Concept is a component or method within a broader concept.
  - id: popularized-by
    description: Person or organization credited with popularizing or formulating a concept.
  - id: practiced-by
    description: Organization known to practice or apply a concept.
  - id: related-concept
    description: A related but distinct concept.
  - id: origin
    description: Historical origin or founding context of a concept.
  - id: application-domain
    description: Domain or context (e.g. personal life, career) where a concept's
      principles are also applied beyond its original professional/industrial context.
