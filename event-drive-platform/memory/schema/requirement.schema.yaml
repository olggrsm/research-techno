type: object
required: [type, id, code, group, priority]
properties:
  type:
    const: requirement
  id:
    type: string
    pattern: "^[prdx]-[0-9]+$"
  code:
    type: string
  group:
    enum: [P, R, D, X]
  priority:
    enum: [MUST, SHOULD]
  sources:
    type: array
    items:
      type: string
